# Global mise configuration.
#
# Deployed as a symlink by `install.sh zsh`:
#   ~/.config/mise/config.toml -> ~/myConfigs/shell/mise/config.toml
#
# This file replaces the *tool installation* half of shell/zsh/zshrc.zinit. Each
# entry below used to be either a zinit `from'gh-r' as'program'` ice (GitHub
# release binaries) or an atclone/atinit hook running a vendor installer
# (sdkman, n, uv, opencode, kubectl, helm, ...).
#
# zinit is still used, but only for what it is good at: loading zsh plugins.
#
# Platform differences use the `os` tool option instead of the repeated
# `if [[ "$(uname -o)" != Msys/Darwin ]]` guards that used to litter zshrc.
#
# Verify a tool/backend:  mise registry <name>   /  mise ls-remote <name>
# Add a tool:             mise use -g <name>@<version>   (then commit this file)

[tools]
# {{{ Shell utilities
fd = "latest"
bat = "latest"
delta = "latest"
dust = "latest"
gdu = "latest"
# 2.24.0 upstream ships no darwin assets (2.23.0 does), so pin + use github:
"github:denisidoro/navi" = "2.23.0"
ripgrep = "latest"
jq = "latest"
yq = "latest"
direnv = "latest"
# }}}

# {{{ Git
lazygit = "latest"
gitleaks = "latest"
gitui = "latest"
"github:github/git-sizer" = "latest"
# }}}

# {{{ Docker and Kubernetes
k9s = "latest"
stern = "latest"
flux2 = "latest"
dive = "latest"
lazydocker = "latest"
k0sctl = "latest"
talosctl = "latest"
kubectl = "latest"
helm = "3" # 3.22.0 via sdkman; move to 4 deliberately, not by accident
drone = "latest"
# }}}

# {{{ Cloud and misc CLI
mc = "latest"
"github:aliyun/aliyun-cli" = "latest"
"github:gotify/cli" = "latest"
"github:foamzou/media-get" = "latest"
"github:yusiwen/myUtilities" = "latest" # provides `mu`
rtk = "latest"
# }}}

# {{{ Development tooling
tree-sitter = "latest"
uv = "latest"
opencode = "latest"
shellcheck = "latest"
# }}}

# {{{ Runtimes (replaces sdkman + n)
# In a version list the FIRST entry is the default, every entry is installed.
# sdkman used to provide zulu 8/11/17/21/23/25 with 25.0.3 as `current`.
java = ["zulu-25", "zulu-23", "zulu-21", "zulu-17", "zulu-11", "zulu-8"]
maven = "latest" # sdkman had 3.9.9
gradle = "8"      # sdkman had 8.12.1; move to 9 deliberately, not by accident
node = "lts"
go = "1.27" # was a /opt/go tarball installed by `install.sh golang`
# rustup stays the source of truth for toolchains (~/.rustup, ~/.cargo are
# reused, nothing is downloaded twice); mise only picks the toolchain. The
# install_env keeps the China mirror when mise drives rustup.
rust = { version = "stable", install_env = { RUSTUP_DIST_SERVER = "https://rsproxy.cn", RUSTUP_UPDATE_ROOT = "https://rsproxy.cn/rustup" } }
# }}}

# {{{ Linux only (macOS gets these from Homebrew)
eza = { version = "latest", os = ["linux"] }
btop = { version = "latest", os = ["linux"] }
# }}}

# Not managed here, on purpose:
#   fzf    - installed by ~/.fzf/install and wired up by unixorn/fzf-zsh-plugin
#   yt-dlp - zinit (Linux only): the same plugin also provides its zsh completion
#   dsh    - npm-only prerelease (@deepseek-ai/dsh); mise's npm backend cannot
#            resolve prerelease-only packages. See shell/mise/README.md.
#   keadm, micromamba - dropped, no longer used (were a zinit gh-r install and a
#            curl installer respectively)

[settings]
# Keep reading .sdkmanrc / .java-version so existing Java projects (e.g.
# spring-framework) keep selecting their JDK without a project mise.toml.
#
# "rust" is here because mise exports RUSTUP_TOOLCHAIN for the toolchain it
# selected, and that environment variable OUTRANKS a repo's rust-toolchain.toml.
# Without it, entering minfer (pinned 1.97.1) would silently build with the
# global `stable` instead of the pinned toolchain. Consequence: a repo whose pin
# is not installed reports it (eza pins 1.90, zed 1.94.1) until you `mise install`
# there.
#
# Deliberately NOT enabled: "go". mise reads go.mod's `go` directive but is
# dropping that in 2026.11 (it is a minimum-compatible version, not the build
# version), and meanwhile it downgrades the selected toolchain and warns
# `missing: go@X` on every prompt in old repos. Go instead relies on the single
# mise-managed toolchain plus Go's own GOTOOLCHAIN=auto; repos that need a pin
# opt in locally (see shell/mise/README.md).
#
# `.tool-versions` is read regardless of this setting (asdf compatibility).
idiomatic_version_file_enable_tools = ["java", "rust"]
